<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="Setup path decision diagram: choose between Codespace, Local Terminal, and Browser based on your environment">
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Main card -->
  <rect x="40" y="30" width="1120" height="490" rx="12" ry="12"
        fill="white" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="700" fill="#24292f">Choose Your Setup Path</text>
  <text x="600" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" fill="#57606a">Pick the environment where you'll run workshop commands — you only need one</text>

  <!-- START node -->
  <rect x="490" y="110" width="220" height="50" rx="25" ry="25"
        fill="#0969da" stroke="none"/>
  <text x="600" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="14" font-weight="600" fill="white">Start Here</text>

  <!-- Arrow down from start -->
  <line x1="600" y1="160" x2="600" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="600,190 780,250 600,310 420,250"
           fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="600" fill="#24292f">Where will you</text>
  <text x="600" y="263" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="600" fill="#24292f">run commands?</text>

  <!-- Left arrow from diamond to Codespace -->
  <line x1="420" y1="250" x2="240" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">browser /</text>
  <text x="330" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">Codespace</text>

  <!-- Right arrow from diamond to Local -->
  <line x1="780" y1="250" x2="960" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">local</text>
  <text x="870" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">terminal</text>

  <!-- Down arrow from diamond to Browser -->
  <line x1="600" y1="310" x2="600" y2="358" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">no terminal</text>

  <!-- Codespace card -->
  <rect x="80" y="195" width="160" height="120" rx="8" ry="8"
        fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="160" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#1a7f37">GitHub Codespace</text>
  <text x="160" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#1a7f37">Runs in your browser</text>
  <text x="160" y="259" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">gh + git + gh-aw</text>
  <text x="160" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">pre-installed</text>
  <text x="160" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#1a7f37">★ Recommended</text>

  <!-- Local card -->
  <rect x="960" y="195" width="160" height="120" rx="8" ry="8"
        fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="1040" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#0969da">Local Terminal</text>
  <text x="1040" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#0969da">Runs on your machine</text>
  <text x="1040" y="259" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">Install: gh CLI ≥ 2.40</text>
  <text x="1040" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">and Git</text>
  <text x="1040" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#0969da">For experienced devs</text>

  <!-- Browser card -->
  <rect x="520" y="360" width="160" height="100" rx="8" ry="8"
        fill="#fff0d4" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="600" y="384" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="700" fill="#bc4c00">Browser Only</text>
  <text x="600" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#bc4c00">GitHub Copilot tab</text>
  <text x="600" y="421" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">No terminal needed</text>
  <text x="600" y="438" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" fill="#57606a">Desktop/laptop only</text>

  <!-- Arrows down from Codespace and Local cards -->
  <line x1="160" y1="315" x2="160" y2="368" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="315" x2="1040" y2="368" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Destination boxes -->
  <rect x="80" y="370" width="160" height="54" rx="8" ry="8"
        fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#1a7f37">Adventure Codespace →</text>
  <text x="160" y="413" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="10" fill="#57606a">02a-setup-codespace.md</text>

  <rect x="960" y="370" width="160" height="54" rx="8" ry="8"
        fill="#f6f8fa" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1040" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#0969da">Adventure Local →</text>
  <text x="1040" y="413" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="10" fill="#57606a">02b-setup-local.md</text>

  <!-- Browser destination -->
  <line x1="600" y1="460" x2="600" y2="478" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="480" width="160" height="32" rx="8" ry="8"
        fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#bc4c00">Adventure Browser →</text>

  <!-- Defs -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>
</svg>
