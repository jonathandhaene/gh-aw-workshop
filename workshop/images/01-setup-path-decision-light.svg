<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="Setup path decision diagram: choose between Codespace, Local Terminal, and Browser based on your environment">
  <rect width="1200" height="560" fill="#f6f8fa"/>
  <rect x="40" y="30" width="1120" height="500" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="20" font-weight="700" fill="#24292f">Choose Your Setup Path</text>
  <text x="600" y="90" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="13" fill="#57606a">Pick the environment where you will run workshop commands — you only need one</text>
  <!-- START node -->
  <rect x="490" y="108" width="220" height="48" rx="24" ry="24" fill="#0969da"/>
  <text x="600" y="138" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#ffffff">Start Here</text>
  <!-- Arrow down from start -->
  <line x1="600" y1="156" x2="600" y2="182" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <!-- Decision diamond -->
  <polygon points="600,184 790,252 600,320 410,252" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="600" y="247" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#24292f">Where will you</text>
  <text x="600" y="265" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#24292f">run commands?</text>
  <!-- Left arrow (Codespace) -->
  <line x1="410" y1="252" x2="240" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <text x="325" y="241" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">cloud /</text>
  <text x="325" y="255" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">Codespace</text>
  <!-- Right arrow (Local) -->
  <line x1="790" y1="252" x2="960" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <text x="875" y="241" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">local</text>
  <text x="875" y="255" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">terminal</text>
  <!-- Down arrow (Browser) -->
  <line x1="600" y1="320" x2="600" y2="348" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <text x="618" y="338" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">no terminal</text>
  <!-- Codespace card -->
  <rect x="60" y="202" width="178" height="118" rx="8" ry="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="149" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#1a7f37">Codespace</text>
  <text x="149" y="247" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">Runs in your browser</text>
  <text x="149" y="264" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">gh + git + gh-aw</text>
  <text x="149" y="280" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">pre-installed</text>
  <text x="149" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#1a7f37">&#x2605; Recommended for most</text>
  <!-- Local card -->
  <rect x="960" y="202" width="178" height="118" rx="8" ry="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="1049" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#0969da">Local Terminal</text>
  <text x="1049" y="247" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">Runs on your machine</text>
  <text x="1049" y="264" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">Needs: gh CLI + Git</text>
  <text x="1049" y="280" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">installed locally</text>
  <text x="1049" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#0969da">For experienced devs</text>
  <!-- Browser card -->
  <rect x="511" y="350" width="178" height="118" rx="8" ry="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="600" y="374" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="12" font-weight="700" fill="#cf222e">Browser (No Terminal)</text>
  <text x="600" y="393" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">github.com + Copilot</text>
  <text x="600" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">Author workflows from</text>
  <text x="600" y="427" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" fill="#57606a">the Agents tab</text>
  <text x="600" y="453" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#cf222e">No installation required</text>
  <!-- Arrows to next-step boxes -->
  <line x1="149" y1="320" x2="149" y2="380" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <line x1="1049" y1="320" x2="1049" y2="380" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <line x1="600" y1="468" x2="600" y2="492" stroke="#57606a" stroke-width="2" marker-end="url(#aL)"/>
  <!-- Next-step boxes -->
  <rect x="60" y="382" width="178" height="44" rx="6" ry="6"
        fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="149" y="401" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" font-weight="600" fill="#1a7f37">&#x2192; 02a-setup-codespace</text>
  <text x="149" y="418" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#57606a">02a-setup-codespace.md</text>
  <rect x="960" y="382" width="178" height="44" rx="6" ry="6"
        fill="#f6f8fa" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1049" y="401" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" font-weight="600" fill="#0969da">&#x2192; 02b-setup-local</text>
  <text x="1049" y="418" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="10" fill="#57606a">02b-setup-local.md</text>
  <rect x="511" y="494" width="178" height="26" rx="6" ry="6"
        fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="600" y="512" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
        font-size="11" font-weight="600" fill="#cf222e">&#x2192; 02c-setup-browser</text>
  <defs>
    <marker id="aL" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#57606a"/>
    </marker>
  </defs>
</svg>
