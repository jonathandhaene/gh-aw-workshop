<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Workflow run summary panel">
  <!-- Page background -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="36" width="1200" height="8" fill="#161b22"/>
  <rect x="200" y="10" width="800" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">github.com/your-org/your-repo/actions/runs/1234567890</text>
  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="40" fill="#161b22"/>
  <line x1="0" y1="83" x2="1200" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Code</text>
  <text x="110" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Issues</text>
  <text x="175" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Pull requests</text>
  <text x="270" y="69" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Actions</text>
  <line x1="268" y1="83" x2="303" y2="83" stroke="#2f81f7" stroke-width="2"/>

  <!-- Run header -->
  <rect x="30" y="100" width="1140" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="60" cy="132" r="14" fill="#238636"/>
  <text x="54" y="137" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">✓</text>
  <text x="85" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6fc">Daily Report Status</text>
  <text x="85" y="148" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Run #42 · Triggered via schedule · main · 2 minutes ago · Duration: 1m 23s</text>
  <rect x="1050" y="116" width="108" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1104" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f0f6fc">Re-run all jobs</text>

  <!-- Jobs panel -->
  <rect x="30" y="178" width="340" height="350" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="206" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Jobs</text>
  <rect x="40" y="214" width="320" height="44" rx="4" fill="#1c2d3f" stroke="#30363d" stroke-width="1"/>
  <circle cx="62" cy="236" r="9" fill="#238636"/>
  <text x="57" y="240" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="13" fill="#2f81f7">run-report</text>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">1m 23s</text>

  <!-- Steps panel -->
  <rect x="390" y="178" width="780" height="350" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="410" y="206" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">run-report</text>
  <!-- Step 1 -->
  <rect x="400" y="216" width="760" height="36" rx="4" fill="#1c2d3f" stroke="#30363d" stroke-width="1"/>
  <circle cx="420" cy="234" r="8" fill="#238636"/>
  <text x="415" y="238" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="436" y="238" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Set up job</text>
  <text x="1090" y="238" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">0s</text>
  <!-- Step 2 -->
  <rect x="400" y="258" width="760" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="420" cy="276" r="8" fill="#238636"/>
  <text x="415" y="280" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="436" y="280" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Checkout repository</text>
  <text x="1090" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">3s</text>
  <!-- Step 3 -->
  <rect x="400" y="300" width="760" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="420" cy="318" r="8" fill="#238636"/>
  <text x="415" y="322" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="436" y="318" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Run agentic workflow</text>
  <text x="1090" y="318" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">1m 18s</text>
  <!-- Step 4 -->
  <rect x="400" y="342" width="760" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="420" cy="360" r="8" fill="#238636"/>
  <text x="415" y="364" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">✓</text>
  <text x="436" y="360" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Post run cleanup</text>
  <text x="1090" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">2s</text>

  <!-- Annotation -->
  <text x="600" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#8b949e">Workflow run summary panel</text>
</svg>
