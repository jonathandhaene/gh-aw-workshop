<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow sidebar with the Run workflow button highlighted">
  <!-- Light theme: page #f6f8fa, panels #ffffff, border #d0d7de, text #24292f, muted #57606a, accent #0969da -->

  <!-- Page background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff"/>
  <rect x="280" y="8" width="640" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="27" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">github.com / jonathandhaene / my-workflow-repo / actions / workflows / daily-report-status.lock.yml</text>

  <!-- Repo nav tabs -->
  <rect x="0" y="44" width="1200" height="44" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#24292f">
    <text x="60" y="72">Code</text>
    <text x="120" y="72">Issues</text>
    <text x="210" y="72">Pull requests</text>
    <text x="330" y="72" fill="#0969da" font-weight="bold">Actions</text>
    <rect x="326" y="84" width="66" height="3" rx="1.5" fill="#0969da"/>
    <text x="420" y="72">Projects</text>
    <text x="500" y="72">Settings</text>
  </g>

  <!-- Content area -->
  <rect x="0" y="88" width="1200" height="472" fill="#f6f8fa"/>

  <!-- Sidebar panel -->
  <rect x="20" y="108" width="280" height="360" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Workflow name in sidebar -->
  <text x="36" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#24292f">Daily Report Status</text>
  <rect x="20" y="145" width="280" height="1" fill="#d0d7de"/>

  <!-- Filter runs row -->
  <text x="36" y="168" font-family="Arial, sans-serif" font-size="12" fill="#57606a">Filter workflow runs</text>
  <rect x="20" y="178" width="280" height="1" fill="#d0d7de"/>

  <!-- Dropdown trigger area -->
  <rect x="36" y="192" width="248" height="36" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="215" font-family="Arial, sans-serif" font-size="13" fill="#24292f">Branch: main</text>
  <text x="260" y="215" font-family="Arial, sans-serif" font-size="13" fill="#57606a">▼</text>

  <!-- Run workflow button — highlighted with accent fill and glow border -->
  <rect x="36" y="244" width="248" height="40" rx="6" fill="#0969da" stroke="#0550ae" stroke-width="2"/>
  <text x="160" y="269" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Run workflow</text>

  <!-- Callout arrow pointing to the button -->
  <polygon points="320,264 360,252 360,276" fill="#0969da"/>
  <rect x="360" y="246" width="280" height="44" rx="6" fill="#0969da"/>
  <text x="500" y="269" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Click here to trigger a run</text>

  <!-- Workflow runs list (right panel) -->
  <rect x="320" y="108" width="860" height="300" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="340" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#24292f">Workflow runs</text>
  <rect x="320" y="146" width="860" height="1" fill="#d0d7de"/>

  <!-- Run row -->
  <rect x="320" y="158" width="860" height="52" fill="#f6f8fa"/>
  <circle cx="360" cy="185" r="12" fill="#1a7f37"/>
  <text x="360" y="191" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="400" y="181" font-family="Arial, sans-serif" font-size="14" fill="#0969da" font-weight="bold">Daily Report Status #3</text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" fill="#57606a">main • 3 minutes ago • schedule</text>

  <!-- Annotation -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle">Workflow sidebar with the Run workflow button highlighted</text>
</svg>
