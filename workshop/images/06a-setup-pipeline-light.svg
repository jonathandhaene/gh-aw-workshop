<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="gh-aw terminal setup pipeline: four steps from auth check through install, doctor, and init to a ready-to-author state">
  <!-- Background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#24292f" text-anchor="middle">gh-aw Terminal Setup Pipeline</text>

  <!-- Subtitle annotation -->
  <text x="600" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57606a" text-anchor="middle">Run these four steps in order to reach a ready-to-author Codespace terminal</text>

  <!-- Step boxes -->
  <!-- Step 1: Auth Check -->
  <rect x="60" y="100" width="200" height="330" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Number badge -->
  <circle cx="160" cy="130" r="18" fill="#0969da"/>
  <text x="160" y="136" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <!-- Title -->
  <text x="160" y="174" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">Authenticate</text>
  <!-- Command chip -->
  <rect x="80" y="188" width="160" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">gh auth status</text>
  <!-- Description -->
  <text x="160" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Confirm you're</text>
  <text x="160" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">logged in to</text>
  <text x="160" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com</text>
  <!-- Output chip -->
  <rect x="80" y="300" width="160" height="52" rx="6" fill="#dafbe1" stroke="#56d364" stroke-width="1"/>
  <text x="160" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">✓ Logged in as</text>
  <text x="160" y="339" font-family="ui-monospace, monospace" font-size="11" fill="#1a7f37" text-anchor="middle">&lt;your-username&gt;</text>
  <!-- Status label -->
  <text x="160" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#1a7f37" text-anchor="middle">Authenticated ✓</text>

  <!-- Arrow 1→2 -->
  <line x1="265" y1="265" x2="305" y2="265" stroke="#d0d7de" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 2: Install -->
  <rect x="310" y="100" width="200" height="330" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="410" cy="130" r="18" fill="#0969da"/>
  <text x="410" y="136" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="410" y="174" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">Install</text>
  <rect x="330" y="188" width="160" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="410" y="205" font-family="ui-monospace, monospace" font-size="10.5" fill="#0969da" text-anchor="middle">gh extension install</text>
  <text x="410" y="218" font-family="ui-monospace, monospace" font-size="10" fill="#0969da" text-anchor="middle">github/gh-aw</text>
  <text x="410" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Install or update</text>
  <text x="410" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">the gh-aw CLI</text>
  <text x="410" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">extension</text>
  <rect x="330" y="300" width="160" height="52" rx="6" fill="#dafbe1" stroke="#56d364" stroke-width="1"/>
  <text x="410" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">✓ gh-aw version</text>
  <text x="410" y="339" font-family="ui-monospace, monospace" font-size="11" fill="#1a7f37" text-anchor="middle">0.xx.x</text>
  <text x="410" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#1a7f37" text-anchor="middle">Extension ready ✓</text>

  <!-- Arrow 2→3 -->
  <line x1="515" y1="265" x2="555" y2="265" stroke="#d0d7de" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 3: Doctor -->
  <rect x="560" y="100" width="200" height="330" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="660" cy="130" r="18" fill="#0969da"/>
  <text x="660" y="136" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="660" y="174" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">Diagnose</text>
  <rect x="580" y="188" width="160" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">gh aw doctor</text>
  <text x="660" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Verify setup</text>
  <text x="660" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">checks gh CLI</text>
  <text x="660" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">authentication</text>
  <rect x="580" y="300" width="160" height="52" rx="6" fill="#dafbe1" stroke="#56d364" stroke-width="1"/>
  <text x="660" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">✓ All checks</text>
  <text x="660" y="339" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">passed</text>
  <text x="660" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#1a7f37" text-anchor="middle">Checks passed ✓</text>

  <!-- Arrow 3→4 -->
  <line x1="765" y1="265" x2="805" y2="265" stroke="#d0d7de" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 4: Init -->
  <rect x="810" y="100" width="200" height="330" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="910" cy="130" r="18" fill="#0969da"/>
  <text x="910" y="136" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="910" y="174" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">Initialize</text>
  <rect x="830" y="188" width="160" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="910" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#0969da" text-anchor="middle">gh aw init</text>
  <text x="910" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Generate skill</text>
  <text x="910" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">files and push</text>
  <text x="910" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">to repository</text>
  <rect x="830" y="300" width="160" height="52" rx="6" fill="#dafbe1" stroke="#56d364" stroke-width="1"/>
  <text x="910" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">✓ SKILL.md and</text>
  <text x="910" y="339" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle">mcp.json created</text>
  <text x="910" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#1a7f37" text-anchor="middle">Skills generated ✓</text>

  <!-- Arrow 4→Ready -->
  <line x1="1015" y1="265" x2="1055" y2="265" stroke="#d0d7de" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Ready box -->
  <rect x="1060" y="180" width="116" height="170" rx="10" fill="#0969da" stroke="#0550ae" stroke-width="1.5"/>
  <text x="1118" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Ready to</text>
  <text x="1118" y="267" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Author! 🚀</text>
  <text x="1118" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#cae8ff" text-anchor="middle">Write your</text>
  <text x="1118" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#cae8ff" text-anchor="middle">first workflow</text>
  <text x="1118" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#cae8ff" text-anchor="middle">→ Step 7</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-light" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d0d7de"/>
    </marker>
  </defs>
</svg>
