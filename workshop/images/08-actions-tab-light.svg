<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Actions tab showing where to find Daily Report Status in the workflow list">
  <rect width="1200" height="560" fill="#f6f8fa"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com/your-org/your-repo/actions</text>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>
  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="48" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="74" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Code</text>
  <text x="90" y="74" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Issues</text>
  <text x="168" y="74" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Pull requests</text>
  <text x="309" y="74" font-family="Arial,sans-serif" font-size="14" fill="#0969da" font-weight="bold">Actions</text>
  <rect x="309" y="88" width="56" height="3" fill="#0969da" rx="2"/>
  <text x="396" y="74" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Settings</text>
  <!-- Left sidebar -->
  <rect x="60" y="105" width="240" height="400" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="135" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#24292f">Workflows</text>
  <rect x="60" y="145" width="240" height="36" fill="#ddf4ff"/>
  <text x="85" y="168" font-family="Arial,sans-serif" font-size="13" fill="#0969da">⚡ Daily Report Status</text>
  <text x="85" y="210" font-family="Arial,sans-serif" font-size="13" fill="#57606a">All workflows</text>
  <!-- Main panel -->
  <rect x="320" y="105" width="820" height="400" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="135" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#24292f">Daily Report Status</text>
  <rect x="940" y="115" width="170" height="34" rx="6" fill="#0969da"/>
  <text x="1025" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Run workflow ▾</text>
  <line x1="320" y1="155" x2="1140" y2="155" stroke="#d0d7de" stroke-width="1"/>
  <!-- Workflow run row -->
  <rect x="320" y="155" width="820" height="56" fill="#f6f8fa"/>
  <circle cx="360" cy="183" r="12" fill="#1f883d"/>
  <text x="360" y="188" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
  <text x="390" y="180" font-family="Arial,sans-serif" font-size="14" fill="#24292f" font-weight="bold">Daily Report Status</text>
  <text x="390" y="198" font-family="Arial,sans-serif" font-size="12" fill="#57606a">main · schedule · 2 minutes ago</text>
  <text x="600" y="540" font-family="Arial,sans-serif" font-size="24" fill="#57606a" text-anchor="middle">Actions tab showing where to find Daily Report Status in the workflow list</text>
</svg>
