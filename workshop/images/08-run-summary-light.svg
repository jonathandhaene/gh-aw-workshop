<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Workflow run summary panel">
  <!-- Background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="32" width="1200" height="12" fill="#ffffff"/>
  <rect x="200" y="10" width="760" height="24" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="580" y="26" font-family="Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com/your-org/your-repo/actions/runs/1234567890</text>

  <!-- Repo header -->
  <rect x="0" y="44" width="1200" height="50" fill="#ffffff"/>
  <text x="40" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#24292f">your-org / your-repo</text>

  <!-- Tab bar -->
  <rect x="0" y="94" width="1200" height="42" fill="#ffffff"/>
  <rect x="0" y="135" width="1200" height="1" fill="#d0d7de"/>
  <text x="40" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Code</text>
  <text x="95" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Issues</text>
  <text x="153" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Pull requests</text>
  <text x="253" y="121" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#24292f">Actions</text>
  <rect x="253" y="134" width="55" height="2" fill="#0969da" rx="1"/>
  <text x="319" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Projects</text>
  <text x="376" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Wiki</text>
  <text x="418" y="121" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Security</text>

  <!-- Main content -->
  <rect x="0" y="136" width="1200" height="424" fill="#ffffff"/>

  <!-- Run title + status -->
  <circle cx="54" cy="175" r="16" fill="#1a7f37"/>
  <text x="54" y="181" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="82" y="168" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#24292f">Daily report — main</text>
  <text x="82" y="188" font-family="Arial, sans-serif" font-size="13" fill="#57606a">workflow_dispatch triggered by jonathandhaene · 2 minutes ago</text>

  <!-- Breadcrumb -->
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="13" fill="#0969da">Daily Report Status</text>
  <text x="178" y="210" font-family="Arial, sans-serif" font-size="13" fill="#57606a">/ Daily report — main</text>

  <rect x="0" y="220" width="1200" height="1" fill="#d0d7de"/>

  <!-- Two-column layout: job graph left, summary right -->
  <!-- Left: Job visualization -->
  <rect x="20" y="236" width="340" height="260" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#24292f">Jobs</text>
  <!-- Job items -->
  <circle cx="50" cy="290" r="10" fill="#1a7f37"/>
  <text x="50" y="295" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="72" y="295" font-family="Arial, sans-serif" font-size="14" fill="#24292f">activation</text>
  <text x="280" y="295" font-family="Arial, sans-serif" font-size="12" fill="#57606a">2s</text>

  <circle cx="50" cy="326" r="10" fill="#1a7f37"/>
  <text x="50" y="331" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="72" y="331" font-family="Arial, sans-serif" font-size="14" fill="#24292f">agent</text>
  <text x="280" y="331" font-family="Arial, sans-serif" font-size="12" fill="#57606a">47s</text>

  <circle cx="50" cy="362" r="10" fill="#1a7f37"/>
  <text x="50" y="367" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="72" y="367" font-family="Arial, sans-serif" font-size="14" fill="#24292f">safe-outputs</text>
  <text x="280" y="367" font-family="Arial, sans-serif" font-size="12" fill="#57606a">5s</text>

  <!-- Right: Summary panel -->
  <rect x="380" y="236" width="800" height="260" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#24292f">Summary</text>
  <rect x="380" y="268" width="800" height="1" fill="#d0d7de"/>

  <!-- Dark log panel inside summary -->
  <rect x="395" y="278" width="768" height="200" rx="4" fill="#0d1117"/>
  <text x="414" y="302" font-family="monospace" font-size="12" fill="#3fb950">##[group]Run agentic workflow</text>
  <text x="414" y="320" font-family="monospace" font-size="12" fill="#c9d1d9">  Analyzing repository state...</text>
  <text x="414" y="338" font-family="monospace" font-size="12" fill="#c9d1d9">  Open issues: 3 | Open PRs: 1 | Stars: 42</text>
  <text x="414" y="356" font-family="monospace" font-size="12" fill="#c9d1d9">  Generating daily status report...</text>
  <text x="414" y="374" font-family="monospace" font-size="12" fill="#3fb950">##[endgroup]</text>
  <text x="414" y="392" font-family="monospace" font-size="12" fill="#3fb950">##[group]Post safe-output: create_issue</text>
  <text x="414" y="410" font-family="monospace" font-size="12" fill="#c9d1d9">  Issue #47 created: Daily Status — 2025-08-09</text>
  <text x="414" y="428" font-family="monospace" font-size="12" fill="#3fb950">##[endgroup]</text>
  <text x="414" y="450" font-family="monospace" font-size="12" fill="#57606a">  Completed in 54s</text>

  <!-- Run metadata -->
  <rect x="20" y="508" width="800" height="28" rx="0" fill="none"/>
  <text x="40" y="523" font-family="Arial, sans-serif" font-size="12" fill="#57606a">Total duration: 54s · Billable time: 1m</text>

  <!-- Annotation -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle">Workflow run summary panel</text>
</svg>
