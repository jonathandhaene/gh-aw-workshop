<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Workflow run summary panel">
  <rect width="1200" height="560" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff" stroke="none"/>
  <rect x="300" y="8" width="600" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="27" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">github.com/your-org/your-repo/actions/runs/1234567890</text>
  <rect x="0" y="44" width="1200" height="48" fill="#ffffff" stroke="none"/>
  <line x1="0" y1="92" x2="1200" y2="92" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="73" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Code</text>
  <text x="120" y="73" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Issues</text>
  <text x="195" y="73" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Pull requests</text>
  <text x="300" y="73" font-family="Arial, sans-serif" font-size="14" fill="#0969da" font-weight="bold">Actions</text>
  <line x1="298" y1="92" x2="348" y2="92" stroke="#0969da" stroke-width="2"/>
  <!-- Breadcrumb -->
  <text x="20" y="118" font-family="Arial, sans-serif" font-size="13" fill="#57606a">Actions / Daily Report Status / Run #42</text>
  <!-- Run header -->
  <circle cx="36" cy="148" r="12" fill="#1a7f37"/>
  <text x="36" y="153" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="56" y="152" font-family="Arial, sans-serif" font-size="16" fill="#24292f" font-weight="bold">Daily Report Status</text>
  <text x="56" y="170" font-family="Arial, sans-serif" font-size="12" fill="#57606a">Triggered via schedule · main · 1m 23s</text>
  <!-- Summary section box -->
  <rect x="20" y="190" width="840" height="300" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="20" y="190" width="840" height="40" rx="6" fill="#f6f8fa" stroke="none"/>
  <rect x="20" y="210" width="840" height="20" fill="#f6f8fa" stroke="none"/>
  <text x="36" y="215" font-family="Arial, sans-serif" font-size="14" fill="#24292f" font-weight="bold">Summary</text>
  <line x1="20" y1="230" x2="860" y2="230" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="258" font-family="Arial, sans-serif" font-size="13" fill="#24292f">The agent completed the daily status report for jonathandhaene/gh-aw-workshop.</text>
  <text x="36" y="280" font-family="Arial, sans-serif" font-size="13" fill="#24292f">3 open issues were found, 1 PR is pending review, and the last commit was 4 hours ago.</text>
  <text x="36" y="302" font-family="Arial, sans-serif" font-size="13" fill="#24292f">Safe output: Created issue #47 with the daily status report.</text>
  <!-- Jobs sidebar -->
  <rect x="880" y="190" width="300" height="300" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="896" y="215" font-family="Arial, sans-serif" font-size="13" fill="#24292f" font-weight="bold">Jobs</text>
  <line x1="880" y1="225" x2="1180" y2="225" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="900" cy="252" r="9" fill="#1a7f37"/>
  <text x="900" y="257" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="916" y="256" font-family="Arial, sans-serif" font-size="13" fill="#24292f">run-agent</text>
  <!-- Annotation -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle">Workflow run summary panel</text>
</svg>