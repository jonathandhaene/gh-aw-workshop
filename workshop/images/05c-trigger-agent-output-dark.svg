<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The three parts of an agentic workflow: a trigger fires an event, the AI agent reasons and acts, and safe outputs write the result back to GitHub">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc" text-anchor="middle">The Three Parts of an Agentic Workflow</text>

  <!-- ── STAGE 1: TRIGGER ── -->
  <rect x="60" y="90" width="300" height="340" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="210" cy="90" r="18" fill="#2f81f7"/>
  <text x="210" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">1</text>
  <text x="210" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2f81f7" text-anchor="middle">Trigger</text>
  <text x="210" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Something starts the workflow</text>

  <rect x="88" y="170" width="244" height="42" rx="8" fill="#1c2d3f" stroke="#1f6feb" stroke-width="1"/>
  <text x="210" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle">⏰  Schedule</text>
  <text x="210" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">cron: "0 8 * * *"</text>

  <rect x="88" y="222" width="244" height="42" rx="8" fill="#1c2d3f" stroke="#1f6feb" stroke-width="1"/>
  <text x="210" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle">💬  Issue Comment</text>
  <text x="210" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">on: issue_comment</text>

  <rect x="88" y="274" width="244" height="42" rx="8" fill="#1c2d3f" stroke="#1f6feb" stroke-width="1"/>
  <text x="210" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle">🔀  Pull Request</text>
  <text x="210" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">on: pull_request</text>

  <rect x="88" y="326" width="244" height="42" rx="8" fill="#1c2d3f" stroke="#1f6feb" stroke-width="1"/>
  <text x="210" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle">🚀  Push</text>
  <text x="210" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">on: push</text>

  <!-- Arrow 1→2 -->
  <line x1="360" y1="260" x2="422" y2="260" stroke="#2f81f7" stroke-width="2.5"/>
  <polygon points="422,253 436,260 422,267" fill="#2f81f7"/>
  <text x="398" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">fires</text>

  <!-- ── STAGE 2: AGENT ── -->
  <rect x="436" y="90" width="328" height="340" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="600" cy="90" r="18" fill="#2f81f7"/>
  <text x="600" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">2</text>
  <text x="600" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2f81f7" text-anchor="middle">AI Agent</text>
  <text x="600" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Reads, reasons, and acts</text>

  <rect x="462" y="170" width="276" height="46" rx="8" fill="#272115" stroke="#9e6a03" stroke-width="1"/>
  <text x="600" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="middle">📖  Read context</text>
  <text x="600" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e3b341" text-anchor="middle">issues, PRs, files, APIs</text>

  <line x1="600" y1="216" x2="600" y2="232" stroke="#9e6a03" stroke-width="2"/>
  <polygon points="594,232 600,242 606,232" fill="#9e6a03"/>

  <rect x="462" y="242" width="276" height="46" rx="8" fill="#272115" stroke="#9e6a03" stroke-width="1"/>
  <text x="600" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="middle">🧠  Reason &amp; decide</text>
  <text x="600" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e3b341" text-anchor="middle">apply judgment, not just rules</text>

  <line x1="600" y1="288" x2="600" y2="304" stroke="#9e6a03" stroke-width="2"/>
  <polygon points="594,304 600,314 606,304" fill="#9e6a03"/>

  <rect x="462" y="314" width="276" height="46" rx="8" fill="#272115" stroke="#9e6a03" stroke-width="1"/>
  <text x="600" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="middle">✍️  Compose output</text>
  <text x="600" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e3b341" text-anchor="middle">summaries, comments, files</text>

  <!-- Arrow 2→3 -->
  <line x1="764" y1="260" x2="826" y2="260" stroke="#2f81f7" stroke-width="2.5"/>
  <polygon points="826,253 840,260 826,267" fill="#2f81f7"/>
  <text x="802" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">writes</text>

  <!-- ── STAGE 3: SAFE OUTPUTS ── -->
  <rect x="840" y="90" width="300" height="340" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="990" cy="90" r="18" fill="#2f81f7"/>
  <text x="990" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">3</text>
  <text x="990" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2f81f7" text-anchor="middle">Safe Outputs</text>
  <text x="990" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Declared actions written to GitHub</text>

  <rect x="868" y="170" width="244" height="42" rx="8" fill="#12261e" stroke="#238636" stroke-width="1"/>
  <text x="990" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">💬  Post a comment</text>
  <text x="990" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">on issue or pull request</text>

  <rect x="868" y="222" width="244" height="42" rx="8" fill="#12261e" stroke="#238636" stroke-width="1"/>
  <text x="990" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">📌  Create an issue</text>
  <text x="990" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">with a generated title + body</text>

  <rect x="868" y="274" width="244" height="42" rx="8" fill="#12261e" stroke="#238636" stroke-width="1"/>
  <text x="990" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">🏷️  Apply a label</text>
  <text x="990" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">or update project fields</text>

  <rect x="868" y="326" width="244" height="42" rx="8" fill="#12261e" stroke="#238636" stroke-width="1"/>
  <text x="990" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">🔀  Open a pull request</text>
  <text x="990" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">with agent-authored changes</text>

  <!-- Bottom annotation -->
  <text x="600" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Unlike standard Actions, the agent applies judgment in step 2 — no two runs produce identical output.</text>

  <!-- Key difference callout -->
  <rect x="300" y="490" width="600" height="46" rx="8" fill="#1c2d3f" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="600" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#79c0ff" text-anchor="middle">💡 Key idea: safe outputs are declared, not executed — the framework applies them</text>
  <text x="600" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79c0ff" text-anchor="middle">after the agent finishes, ensuring every write goes through a single controlled path.</text>
</svg>
