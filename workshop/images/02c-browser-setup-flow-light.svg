<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Browser setup path: create repository, skip CLI install, use GitHub UI to install and run agentic workflows">
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="600" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#24292f" text-anchor="middle">Browser Setup Path</text>
  <text x="600" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57606a" text-anchor="middle">How to go from zero to running agentic workflows — no terminal required</text>

  <!-- Step boxes -->
  <!-- Step 1: Create Repository -->
  <rect x="60" y="130" width="190" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="60" y="130" width="190" height="8" rx="8" fill="#0969da"/>
  <rect x="60" y="138" width="190" height="0" fill="#0969da"/>
  <text x="155" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Create Repository</text>
  <text x="155" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com/new</text>
  <!-- Badge 1 -->
  <circle cx="96" cy="130" r="14" fill="#0969da"/>
  <text x="96" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="170" x2="310" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 2: Actions Intro -->
  <rect x="310" y="130" width="190" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="310" y="130" width="190" height="8" rx="8" fill="#0969da"/>
  <text x="405" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Learn GitHub Actions</text>
  <text x="405" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Steps 4–5</text>
  <circle cx="346" cy="130" r="14" fill="#0969da"/>
  <text x="346" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Arrow 2→3 -->
  <line x1="500" y1="170" x2="560" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 3: Skip CLI (dashed / muted) -->
  <rect x="560" y="130" width="190" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="655" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#57606a" text-anchor="middle">Skip CLI Install</text>
  <text x="655" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Steps 6a–6b skipped</text>
  <!-- strikethrough style indicator -->
  <line x1="577" y1="165" x2="733" y2="165" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="596" cy="130" r="14" fill="#57606a"/>
  <text x="596" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Arrow 3→4 -->
  <line x1="750" y1="170" x2="810" y2="170" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 4: UI Install -->
  <rect x="810" y="130" width="190" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="810" y="130" width="190" height="8" rx="8" fill="#0969da"/>
  <text x="905" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Install via GitHub UI</text>
  <text x="905" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Step 6c — browser only</text>
  <circle cx="846" cy="130" r="14" fill="#0969da"/>
  <text x="846" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- ─── Bottom row ─── -->

  <!-- Arrow down from step 4 -->
  <line x1="905" y1="210" x2="905" y2="280" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 5: Author workflow in Copilot tab -->
  <rect x="760" y="280" width="290" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="760" y="280" width="290" height="8" rx="8" fill="#0969da"/>
  <text x="905" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Author Workflow in Copilot Tab</text>
  <text x="905" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Create &amp; edit .md workflow files</text>
  <circle cx="796" cy="280" r="14" fill="#0969da"/>
  <text x="796" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- Arrow from step 5 left -->
  <line x1="760" y1="320" x2="560" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 6: Run from Actions -->
  <rect x="360" y="280" width="200" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="360" y="280" width="200" height="8" rx="8" fill="#1a7f37"/>
  <text x="460" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Run Workflow</text>
  <text x="460" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Actions tab → trigger</text>
  <circle cx="396" cy="280" r="14" fill="#1a7f37"/>
  <text x="396" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- Arrow from step 6 left -->
  <line x1="360" y1="320" x2="210" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 7: See output -->
  <rect x="60" y="280" width="150" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="60" y="280" width="150" height="8" rx="8" fill="#1a7f37"/>
  <text x="135" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">See Output</text>
  <text x="135" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a" text-anchor="middle">AI results in browser</text>
  <circle cx="96" cy="280" r="14" fill="#1a7f37"/>
  <text x="96" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>

  <!-- Legend -->
  <rect x="60" y="440" width="18" height="10" rx="2" fill="#0969da"/>
  <text x="84" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a">Setup &amp; authoring</text>
  <rect x="220" y="440" width="18" height="10" rx="2" fill="#1a7f37"/>
  <text x="244" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a">Run &amp; observe</text>
  <rect x="380" y="435" width="28" height="18" rx="3" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="414" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#57606a">Skipped step</text>

  <!-- Bottom annotation -->
  <text x="600" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">All authoring, compilation, and workflow runs happen in the GitHub browser UI — no terminal required.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>
</svg>
