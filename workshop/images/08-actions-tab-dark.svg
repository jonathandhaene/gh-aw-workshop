<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Actions tab showing where to find Daily Report Status in the workflow list">
  <!-- Dark theme: page #0d1117, panels #161b22, border #30363d, text #f0f6fc, muted #8b949e, accent #2f81f7 -->

  <!-- Page background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#161b22"/>
  <!-- URL bar -->
  <rect x="280" y="8" width="640" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="27" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">github.com / jonathandhaene / my-workflow-repo</text>

  <!-- Repo nav tabs -->
  <rect x="0" y="44" width="1200" height="44" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#f0f6fc">
    <text x="60" y="72">Code</text>
    <text x="120" y="72">Issues</text>
    <text x="210" y="72">Pull requests</text>
    <text x="330" y="72" fill="#2f81f7" font-weight="bold">Actions</text>
    <rect x="326" y="84" width="66" height="3" rx="1.5" fill="#2f81f7"/>
    <text x="420" y="72">Projects</text>
    <text x="500" y="72">Settings</text>
  </g>

  <!-- Content area -->
  <rect x="0" y="88" width="1200" height="472" fill="#0d1117"/>

  <!-- Sidebar -->
  <rect x="20" y="108" width="240" height="320" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="36" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">Workflows</text>
  <!-- sidebar items -->
  <rect x="20" y="145" width="240" height="36" fill="#1f2937"/>
  <text x="36" y="169" font-family="Arial, sans-serif" font-size="13" fill="#2f81f7" font-weight="bold">Daily Report Status</text>
  <text x="36" y="200" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">All workflows</text>

  <!-- Run workflow button in sidebar -->
  <rect x="32" y="370" width="144" height="32" rx="6" fill="#2f81f7"/>
  <text x="104" y="391" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Run workflow</text>

  <!-- Main workflow runs panel -->
  <rect x="280" y="108" width="900" height="340" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f0f6fc">Daily Report Status</text>

  <!-- Run row header -->
  <rect x="280" y="148" width="900" height="1" fill="#30363d"/>
  <text x="320" y="168" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Status</text>
  <text x="420" y="168" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Workflow run</text>
  <text x="860" y="168" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Trigger</text>
  <text x="1000" y="168" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Duration</text>

  <!-- Run row 1 -->
  <rect x="280" y="178" width="900" height="52" fill="#1c2128"/>
  <circle cx="320" cy="205" r="12" fill="#238636"/>
  <text x="320" y="211" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="420" y="201" font-family="Arial, sans-serif" font-size="14" fill="#2f81f7" font-weight="bold">Daily Report Status #3</text>
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">main • 2 minutes ago</text>
  <text x="860" y="205" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">schedule</text>
  <text x="1000" y="205" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">1m 23s</text>

  <!-- Run row 2 -->
  <rect x="280" y="230" width="900" height="52" fill="#161b22"/>
  <circle cx="320" cy="257" r="12" fill="#238636"/>
  <text x="320" y="263" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="420" y="253" font-family="Arial, sans-serif" font-size="14" fill="#2f81f7">Daily Report Status #2</text>
  <text x="420" y="272" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">main • 1 day ago</text>
  <text x="860" y="257" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">schedule</text>
  <text x="1000" y="257" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">1m 18s</text>

  <!-- Run row 3 -->
  <rect x="280" y="282" width="900" height="52" fill="#1c2128"/>
  <circle cx="320" cy="309" r="12" fill="#238636"/>
  <text x="320" y="315" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="420" y="305" font-family="Arial, sans-serif" font-size="14" fill="#2f81f7">Daily Report Status #1</text>
  <text x="420" y="324" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">main • 2 days ago</text>
  <text x="860" y="309" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">workflow_dispatch</text>
  <text x="1000" y="309" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">1m 05s</text>

  <!-- Annotation -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Actions tab showing where to find Daily Report Status in the workflow list</text>
</svg>
