<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Actions tab showing where to find Daily Report Status in the workflow list">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="32" width="1200" height="12" fill="#161b22" stroke="none"/>
  <!-- URL bar -->
  <rect x="200" y="10" width="760" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="580" y="26" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">github.com/your-org/your-repo/actions</text>

  <!-- Repo header -->
  <rect x="0" y="44" width="1200" height="50" fill="#161b22" stroke="none"/>
  <text x="40" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6fc">your-org / your-repo</text>

  <!-- Tab bar -->
  <rect x="0" y="94" width="1200" height="42" fill="#161b22" stroke="none"/>
  <rect x="0" y="135" width="1200" height="1" fill="#30363d"/>

  <!-- Tabs -->
  <text x="40" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Code</text>
  <text x="95" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Issues</text>
  <text x="153" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Pull requests</text>
  <!-- Active tab: Actions -->
  <text x="253" y="121" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Actions</text>
  <rect x="253" y="134" width="55" height="2" fill="#2f81f7" rx="1"/>
  <text x="319" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Projects</text>
  <text x="376" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Wiki</text>
  <text x="418" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Security</text>
  <text x="479" y="121" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Settings</text>

  <!-- Left sidebar -->
  <rect x="0" y="136" width="260" height="424" fill="#0d1117" stroke="none"/>
  <rect x="260" y="136" width="1" height="424" fill="#30363d"/>
  <text x="20" y="168" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Workflows</text>
  <!-- Filter box -->
  <rect x="12" y="177" width="232" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="128" y="196" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Filter workflows</text>

  <!-- Sidebar items -->
  <rect x="0" y="214" width="260" height="32" fill="#2f81f7" fill-opacity="0.15" rx="0"/>
  <rect x="8" y="222" width="4" height="16" fill="#2f81f7" rx="2"/>
  <text x="22" y="234" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2f81f7">Daily Report Status</text>

  <text x="18" y="266" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">PR Reviewer</text>
  <text x="18" y="298" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Code Quality</text>

  <!-- Main content -->
  <rect x="261" y="136" width="939" height="424" fill="#0d1117"/>

  <!-- Workflow list header -->
  <text x="290" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc">Daily Report Status</text>
  <rect x="1080" y="150" width="110" height="30" rx="5" fill="#2f81f7" stroke="none"/>
  <text x="1135" y="170" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Run workflow</text>

  <!-- Table header -->
  <rect x="261" y="198" width="939" height="1" fill="#30363d"/>
  <text x="290" y="220" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Status</text>
  <text x="370" y="220" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Name</text>
  <text x="800" y="220" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Workflow</text>
  <text x="990" y="220" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Triggered</text>
  <rect x="261" y="228" width="939" height="1" fill="#30363d"/>

  <!-- Workflow run row 1 - success -->
  <rect x="261" y="229" width="939" height="52" fill="#0d1117"/>
  <circle cx="302" cy="255" r="12" fill="#1a7f37"/>
  <text x="302" y="260" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="370" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Daily report — main</text>
  <text x="370" y="270" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">workflow_dispatch · 2 minutes ago</text>
  <text x="800" y="258" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">daily-report-status.lock.yml</text>
  <text x="990" y="258" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">jonathandhaene</text>
  <rect x="261" y="281" width="939" height="1" fill="#30363d"/>

  <!-- Workflow run row 2 -->
  <rect x="261" y="282" width="939" height="52" fill="#0d1117"/>
  <circle cx="302" cy="308" r="12" fill="#1a7f37"/>
  <text x="302" y="313" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="370" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">Daily report — main</text>
  <text x="370" y="323" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">schedule · 1 day ago</text>
  <text x="800" y="311" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">daily-report-status.lock.yml</text>
  <text x="990" y="311" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">github-actions</text>
  <rect x="261" y="334" width="939" height="1" fill="#30363d"/>

  <!-- Annotation -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Actions tab showing where to find Daily Report Status in the workflow list</text>
</svg>
