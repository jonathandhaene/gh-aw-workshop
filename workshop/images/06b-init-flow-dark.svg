<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="gh aw init initialization flow: the command scaffolds skill files, agent instructions, MCP config, and a Copilot setup workflow into your repository">
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="38" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc" text-anchor="middle">What gh aw init Creates in Your Repository</text>

  <!-- Command box -->
  <rect x="60" y="70" width="220" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="95" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#2f81f7" text-anchor="middle">gh aw init</text>
  <text x="170" y="114" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Run once in your repo</text>

  <!-- Arrow right -->
  <line x1="280" y1="98" x2="330" y2="98" stroke="#30363d" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Center hub -->
  <rect x="330" y="64" width="160" height="68" rx="8" fill="#1f3d5c" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="410" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#2f81f7" text-anchor="middle">Scaffolds Files</text>
  <text x="410" y="111" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">into .github/ + .vscode/</text>

  <!-- Arrows from hub to outputs -->
  <line x1="490" y1="82" x2="560" y2="130" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="490" y1="90" x2="560" y2="230" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="490" y1="96" x2="560" y2="330" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="490" y1="102" x2="560" y2="420" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="490" y1="108" x2="560" y2="500" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- Output boxes -->
  <!-- Skills -->
  <rect x="560" y="106" width="300" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="560" y="106" width="8" height="64" rx="3" fill="#2f81f7"/>
  <text x="579" y="127" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#2f81f7">.github/skills/agentic-workflows/</text>
  <text x="579" y="143" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">SKILL.md</text>
  <text x="579" y="160" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#8b949e">Defines Copilot authoring skill context</text>

  <!-- Agents -->
  <rect x="560" y="206" width="300" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="560" y="206" width="8" height="64" rx="3" fill="#3fb950"/>
  <text x="579" y="227" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#3fb950">.github/agents/</text>
  <text x="579" y="243" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">agentic-workflows.md</text>
  <text x="579" y="260" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#8b949e">Agent instruction file for Copilot</text>

  <!-- MCP -->
  <rect x="560" y="306" width="300" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="560" y="306" width="8" height="64" rx="3" fill="#e3b341"/>
  <text x="579" y="327" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#e3b341">.github/mcp.json</text>
  <text x="579" y="343" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">&amp; .github/workflows/</text>
  <text x="579" y="360" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#8b949e">MCP server config for gh-aw tools</text>

  <!-- Copilot Setup Steps -->
  <rect x="560" y="396" width="300" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="560" y="396" width="8" height="64" rx="3" fill="#bc8cff"/>
  <text x="579" y="417" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#bc8cff">copilot-setup-steps.yml</text>
  <text x="579" y="433" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">in .github/workflows/</text>
  <text x="579" y="450" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#8b949e">Preinstalls gh-aw in Copilot cloud agent</text>

  <!-- VS Code Settings -->
  <rect x="560" y="476" width="300" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="560" y="476" width="8" height="56" rx="3" fill="#8b949e"/>
  <text x="579" y="497" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#8b949e">.vscode/settings.json</text>
  <text x="579" y="513" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="#8b949e">Editor settings for workflow authoring</text>

  <!-- Commit reminder box -->
  <rect x="880" y="280" width="280" height="80" rx="8" fill="#272115" stroke="#e3b341" stroke-width="1.5"/>
  <text x="1020" y="306" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e3b341" text-anchor="middle">⚠ Commit &amp; Push</text>
  <text x="1020" y="326" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">git add .</text>
  <text x="1020" y="343" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">git commit -m "..."</text>
  <text x="1020" y="360" font-family="ui-monospace,monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">git push</text>

  <!-- Arrow from outputs to commit reminder -->
  <line x1="860" y1="320" x2="878" y2="320" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGold)"/>

  <!-- Annotation -->
  <text x="600" y="545" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Run gh aw init once, then commit and push all generated files before authoring your first workflow.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowDark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e3b341"/>
    </marker>
  </defs>
</svg>
