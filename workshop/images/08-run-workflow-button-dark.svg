<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Workflow sidebar with the Run workflow button highlighted">
  <!-- Page background -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="36" width="1200" height="8" fill="#161b22"/>
  <!-- URL bar -->
  <rect x="200" y="10" width="800" height="24" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">github.com/your-org/your-repo/actions/workflows/daily-report.lock.yml</text>
  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="40" fill="#161b22"/>
  <line x1="0" y1="83" x2="1200" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Code</text>
  <text x="110" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Issues</text>
  <text x="175" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Pull requests</text>
  <text x="270" y="69" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Actions</text>
  <line x1="268" y1="83" x2="303" y2="83" stroke="#2f81f7" stroke-width="2"/>
  <text x="330" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Projects</text>
  <text x="390" y="69" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Settings</text>

  <!-- Sidebar -->
  <rect x="30" y="100" width="300" height="430" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Workflows</text>
  <rect x="30" y="140" width="300" height="38" fill="#1c2d3f"/>
  <text x="55" y="164" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2f81f7">Daily Report Status</text>
  <text x="55" y="202" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">CI Build</text>
  <text x="55" y="232" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">Deploy</text>

  <!-- Main area -->
  <rect x="360" y="100" width="810" height="430" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="380" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6fc">Daily Report Status</text>
  <!-- Run workflow button highlighted -->
  <rect x="1050" y="107" width="110" height="32" rx="6" fill="#2f81f7" stroke="#2f81f7" stroke-width="2"/>
  <text x="1105" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Run workflow</text>
  <!-- Arrow -->
  <polygon points="1020,123 1040,113 1040,133" fill="#2f81f7"/>
  <text x="880" y="128" font-family="Arial, sans-serif" font-size="12" fill="#2f81f7" font-weight="600">← Click here to start a run</text>
  <!-- Divider -->
  <line x1="360" y1="148" x2="1170" y2="148" stroke="#30363d" stroke-width="1"/>
  <!-- Filter bar -->
  <rect x="370" y="155" width="790" height="32" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="175" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Filter workflow runs</text>
  <!-- Run rows -->
  <rect x="370" y="196" width="790" height="48" rx="4" fill="#1c2d3f" stroke="#30363d" stroke-width="1"/>
  <circle cx="398" cy="220" r="10" fill="#238636"/>
  <text x="392" y="225" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">✓</text>
  <text x="420" y="217" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Daily Report Status</text>
  <text x="420" y="235" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">#42 · main · workflow_dispatch · 2 minutes ago</text>
  <rect x="370" y="252" width="790" height="48" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="398" cy="276" r="10" fill="#238636"/>
  <text x="392" y="281" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">✓</text>
  <text x="420" y="273" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Daily Report Status</text>
  <text x="420" y="291" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">#41 · main · schedule · 1 day ago</text>

  <!-- Annotation -->
  <text x="600" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#8b949e">Workflow sidebar with the Run workflow button highlighted</text>
</svg>
