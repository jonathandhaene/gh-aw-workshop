<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow sidebar with the Run workflow button highlighted">
  <!-- Dark theme: page #0d1117, panels #161b22, border #30363d, text #f0f6fc, muted #8b949e, accent #2f81f7 -->

  <!-- Page background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#161b22"/>
  <rect x="280" y="8" width="640" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="27" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">github.com / jonathandhaene / my-workflow-repo / actions / workflows / daily-report-status.lock.yml</text>

  <!-- Repo nav tabs -->
  <rect x="0" y="44" width="1200" height="44" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#f0f6fc">
    <text x="60" y="72">Code</text>
    <text x="120" y="72">Issues</text>
    <text x="210" y="72">Pull requests</text>
    <text x="330" y="72" fill="#2f81f7" font-weight="bold">Actions</text>
    <rect x="326" y="84" width="66" height="3" rx="1.5" fill="#2f81f7"/>
    <text x="420" y="72">Projects</text>
    <text x="500" y="72">Settings</text>
  </g>

  <!-- Content area -->
  <rect x="0" y="88" width="1200" height="472" fill="#0d1117"/>

  <!-- Sidebar panel -->
  <rect x="20" y="108" width="280" height="360" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Workflow name in sidebar -->
  <text x="36" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc">Daily Report Status</text>
  <rect x="20" y="145" width="280" height="1" fill="#30363d"/>

  <!-- Filter runs row -->
  <text x="36" y="168" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Filter workflow runs</text>
  <rect x="20" y="178" width="280" height="1" fill="#30363d"/>

  <!-- Dropdown trigger area -->
  <rect x="36" y="192" width="248" height="36" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="215" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">Branch: main</text>
  <text x="260" y="215" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">▼</text>

  <!-- Run workflow button — highlighted -->
  <rect x="36" y="244" width="248" height="40" rx="6" fill="#2f81f7" stroke="#1f6feb" stroke-width="2"/>
  <text x="160" y="269" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Run workflow</text>

  <!-- Callout arrow pointing to the button -->
  <polygon points="320,264 360,252 360,276" fill="#2f81f7"/>
  <rect x="360" y="246" width="280" height="44" rx="6" fill="#2f81f7"/>
  <text x="500" y="269" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Click here to trigger a run</text>

  <!-- Workflow runs list (right panel) -->
  <rect x="320" y="108" width="860" height="300" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f0f6fc">Workflow runs</text>
  <rect x="320" y="146" width="860" height="1" fill="#30363d"/>

  <!-- Run row -->
  <rect x="320" y="158" width="860" height="52" fill="#1c2128"/>
  <circle cx="360" cy="185" r="12" fill="#238636"/>
  <text x="360" y="191" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="400" y="181" font-family="Arial, sans-serif" font-size="14" fill="#2f81f7" font-weight="bold">Daily Report Status #3</text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">main • 3 minutes ago • schedule</text>

  <!-- Annotation -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Workflow sidebar with the Run workflow button highlighted</text>
</svg>
