<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow sidebar with the Run workflow button highlighted">
  <rect width="1200" height="560" fill="#0d1117"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#161b22"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">github.com/your-org/your-repo/actions</text>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>
  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Code</text>
  <text x="90" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Issues</text>
  <text x="168" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Pull requests</text>
  <text x="309" y="74" font-family="Arial,sans-serif" font-size="14" fill="#2f81f7" font-weight="bold">Actions</text>
  <rect x="309" y="88" width="56" height="3" fill="#2f81f7" rx="2"/>
  <text x="396" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">Settings</text>
  <!-- Left sidebar -->
  <rect x="60" y="105" width="240" height="400" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="135" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc">Workflows</text>
  <rect x="60" y="145" width="240" height="36" fill="#1c2128"/>
  <text x="85" y="168" font-family="Arial,sans-serif" font-size="13" fill="#2f81f7">⚡ Daily Report Status</text>
  <text x="85" y="210" font-family="Arial,sans-serif" font-size="13" fill="#8b949e">All workflows</text>
  <!-- Main panel -->
  <rect x="320" y="105" width="820" height="400" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="135" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Daily Report Status</text>
  <!-- Run workflow button highlighted -->
  <rect x="936" y="111" width="178" height="42" rx="8" fill="#2f81f7" opacity="0.25"/>
  <rect x="940" y="115" width="170" height="34" rx="6" fill="#2f81f7"/>
  <text x="1025" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Run workflow ▾</text>
  <!-- Arrow annotation -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>
  <line x1="880" y1="132" x2="935" y2="132" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>
  <text x="760" y="128" font-family="Arial,sans-serif" font-size="13" fill="#f85149" font-weight="bold">Click here</text>
  <line x1="320" y1="155" x2="1140" y2="155" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="185" font-family="Arial,sans-serif" font-size="14" fill="#8b949e">No workflow runs yet.</text>
  <text x="600" y="540" font-family="Arial,sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Workflow sidebar with the Run workflow button highlighted</text>
</svg>
